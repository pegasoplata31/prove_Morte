name: Build Beyond Words APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Guante-De-Voz-App   # 👈 CLAVE: aquí se ejecuta todo
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - Ver estructura
        run: |
          echo "=== Directorio actual ==="
          pwd
          echo ""
          echo "=== Contenido ==="
          ls -la
          echo ""
          echo "=== lib/ ==="
          ls -la lib/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beyond-words-release
          path: Guante-De-Voz-App/build/app/outputs/flutter-apk/app-release.apk
